<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<title>Signup | AI Tax Assistant</title>

<style>

:root{
--primary:#1a56db;
--border:#e2e8f0;
--surface:#ffffff;
--text:#0f172a;
--text-muted:#64748b;
--radius:14px;
--shadow:0 6px 22px rgba(0,0,0,0.06);
}

body{
font-family:'DM Sans',sans-serif;
background:#f1f5f9;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.card-box{
width:100%;
max-width:420px;
background:var(--surface);
border-radius:var(--radius);
box-shadow:var(--shadow);
padding:2rem;
border:1px solid var(--border);
}

.avatar{
width:60px;
height:60px;
border-radius:14px;
background:linear-gradient(135deg,#1a56db,#3b82f6);
display:flex;
align-items:center;
justify-content:center;
font-size:1.8rem;
margin:auto;
color:white;
margin-bottom:10px;
}

.title{
font-family:'Sora';
font-weight:700;
text-align:center;
font-size:1.3rem;
}

.subtitle{
text-align:center;
font-size:0.85rem;
color:var(--text-muted);
margin-bottom:1.5rem;
}

.form-control{
border-radius:10px;
font-size:0.9rem;
padding:0.6rem;
}

.btn-main{
background:#1a56db;
color:white;
border:none;
border-radius:10px;
padding:0.6rem;
width:100%;
margin-top:10px;
font-weight:600;
}

.footer{
text-align:center;
font-size:0.8rem;
margin-top:12px;
}

.footer a{
text-decoration:none;
font-weight:600;
color:#1a56db;
}

</style>
</head>

<body>

<div class="card-box">

<div class="avatar">🤖</div>

<div class="title">Create Account</div>
<div class="subtitle">Start using your AI CFO assistant</div>

<form onsubmit="SignUpUser(event)">

<div class="mb-2">
<input class="form-control" name="name" id="name" placeholder="Full Name" required>
</div>

<div class="mb-2">
<input class="form-control" type="email" id="email" name="email" placeholder="Email" required>
</div>

<div class="mb-2">
<input class="form-control" type="password" id="password" name="password" placeholder="Password" required>
</div>

<div class="mb-2">
<input class="form-control" type="password" id="confirm_password" name="confirm_password" placeholder="Confirm Password" required>
</div>

<button class="btn-main">Create Account</button>

</form>

<div class="footer">
Already have an account? <a href="{{ url_for('authentication_bp.login') }}">Login</a>
</div>

</div>

</body>
<script>
async function SignUpUser(event) {

    event.preventDefault();

    const name = document.getElementById("name").value;
    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;
    const repassword = document.getElementById("confirm_password").value;

    if (password !== repassword) {
        alert("Passwords do not match");
        return;
    }

    try {

        const response = await fetch("/signup_user", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                name: name,
                email: email,
                password: password,
                repassword: repassword
            })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = data.redirect;
        }
        else {
            alert(data.message || "Signup failed");
        }

    } catch (error) {
        console.error("Signup error:", error);
        alert("Something went wrong");
    }
}
</script>
</html>
