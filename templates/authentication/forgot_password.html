<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Sora:wght@400;600;700&family=DM+Sans:wght@400;500&display=swap" rel="stylesheet">

<title>Reset Password</title>

<style>

body{
font-family:'DM Sans',sans-serif;
background:#f1f5f9;
height:100vh;
display:flex;
align-items:center;
justify-content:center;
}

.box{
max-width:420px;
width:100%;
background:white;
border-radius:14px;
padding:2rem;
box-shadow:0 6px 22px rgba(0,0,0,0.06);
}

.avatar{
width:60px;
height:60px;
border-radius:14px;
background:linear-gradient(135deg,#1a56db,#3b82f6);
display:flex;
align-items:center;
justify-content:center;
color:white;
font-size:1.8rem;
margin:auto;
margin-bottom:10px;
}

.title{
font-family:'Sora';
font-weight:700;
text-align:center;
font-size:1.2rem;
}

.subtitle{
text-align:center;
font-size:0.85rem;
color:#64748b;
margin-bottom:20px;
}

.form-control{
border-radius:10px;
padding:0.6rem;
}

.btn-main{
background:#1a56db;
color:white;
border:none;
width:100%;
border-radius:10px;
padding:0.6rem;
font-weight:600;
}

.footer{
text-align:center;
font-size:0.8rem;
margin-top:10px;
}

.footer a{
text-decoration:none;
font-weight:600;
color:#1a56db;
}

</style>
</head>

<body>

<div class="box">

<div class="avatar">🔑</div>

<div class="title">Forgot Password</div>

<div class="subtitle">
Enter your email to reset password
</div>

<form onsubmit="ForgotPasswordUser(event)">

<input type="email" name="email" id="email" class="form-control mb-3" placeholder="Enter your email" required>

<button class="btn-main">Send Reset Link</button>

</form>

<div class="footer">
<a href="{{ url_for('authentication_bp.login') }}">Back to Login</a>
</div>

</div>
</body>
<script>
    async function ForgotPasswordUser(event) {
        event.preventDefault();

        const email = document.getElementById("email").value;

        try {

        const response = await fetch("/forgot_password_user", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify({
                email: email,

            })
        });

        const data = await response.json();

        if (response.ok) {
            window.location.href = data.redirect;
        }
        else {
            alert(data.message || "Wrong email id");
        }

    } catch (error) {
        console.error("Signup error:", error);
        alert("Something went wrong");
    }
}

</script>
</html>
